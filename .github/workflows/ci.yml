name: CI

# The deploy lives in this workflow, as a job that needs `verify`, rather than in
# a second workflow on the same push.
#
# Two separate workflows on `push: main` cannot be ordered against each other, so a
# migration that breaks the site produces a green check run and a broken live page
# simultaneously. Folding the deploy in makes the ordering a property of the graph
# rather than a matter of two runs happening to race: a push that fails its checks
# cannot deploy, because the deploy job is never reached.
#
# `workflow_dispatch` re-runs the same path rather than a shortcut, so a manual
# deploy is gated by the same checks as an automatic one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The compiler is a check in its own right and not a footnote to the build: a
      # site that never ran it could not tell a typed import from an untyped one, and
      # an untyped import silences every diagnostic a rename would have produced.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # After the build, because three of the four gates read the export. The
      # dependency gate reads the lockfile and would pass earlier; running it here
      # keeps the whole `check` a single step a reader can run locally.
      - run: pnpm check

  deploy:
    needs: verify
    if: github.repository == 'NaniSoft/landing-page' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Auth is the org-level CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID pair
      # (visibility: all).
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
